name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: qlvpp_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install API dependencies
        working-directory: apps/api
        run: npm install

      - name: Load database schema
        run: |
          mysql -h 127.0.0.1 -u root -proot_password qlvpp_test < packages/db/schema.sql

      - name: Run database migrations
        working-directory: apps/api
        run: node ../../packages/db/migrate.js
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_TEST }}
          DB_NAME: qlvpp_test

      - name: Run unit & integration tests
        working-directory: apps/api
        run: npm test -- --coverage --forceExit
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_TEST }}
          DB_NAME: qlvpp_test
          REDIS_HOST: localhost
          SESSION_SECRET: ${{ secrets.SESSION_SECRET_TEST }}

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build -t qlvpp-api ./apps/api

      - name: Build Web image
        run: docker build -t qlvpp-web ./apps/web