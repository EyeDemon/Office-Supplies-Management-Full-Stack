services:
  # ── MySQL Database ───────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: qlvpp-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: qlvpp
      MYSQL_USER: qlvpp_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - qlvpp_db_data:/var/lib/mysql
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./packages/db/seeds/seed_v4.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (Event Bus & Queues) ──────────────────────────────────
  redis:
    image: redis:7.0-alpine
    container_name: qlvpp-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}" ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Node.js API (apps/api/) ──────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: qlvpp-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: qlvpp
      DB_USER: qlvpp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SESSION_SECRET: "${SESSION_SECRET:?ERROR: Set SESSION_SECRET in .env (min 32 chars)}"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      EMAIL_MODE: ${EMAIL_MODE:-dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      ADJUSTMENT_THRESHOLD: ${ADJUSTMENT_THRESHOLD:-100}
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── React Frontend (apps/web/) ──────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: qlvpp-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:80/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Caddy Gateway (Auto-HTTPS & Reverse Proxy) ────────────────────
  gateway:
    image: caddy:2.7-alpine
    container_name: qlvpp-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── DB Backup (Cron hàng ngày lúc 2:00 AM) ──────────────────────
  backup:
    image: mysql:8.0
    container_name: qlvpp-backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DB_NAME: qlvpp
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
    volumes:
      - qlvpp_backups:/backups
      - ./scripts/db-backup.sh:/db-backup.sh:ro
    entrypoint: >
      bash -c "
        chmod +x /db-backup.sh &&
        echo '0 2 * * * /db-backup.sh >> /backups/backup.log 2>&1' | crontab - &&
        echo '[Backup] Đã đăng ký cron 02:00 AM hàng ngày.' &&
        cron -f
      "

volumes:
  qlvpp_db_data:
    driver: local
  qlvpp_backups:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local